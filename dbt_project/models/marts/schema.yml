
version: 2

models:
  - name: dim_customer_360
    description: "Gold-layer Customer 360 dimension with customer segments and health status."

    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - unique
          - not_null

      - name: email
        description: "Standardized customer email address."
        data_tests:
          - not_null

      - name: annual_revenue
        description: "Annual customer revenue."
        data_tests:
          - not_null

      - name: account_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Active
                  - At Risk
                  - Churned

      - name: revenue_segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - SMB
                  - Mid-Market
                  - Enterprise

      - name: engagement_segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Highly Engaged
                  - Moderately Engaged
                  - Low Engagement

      - name: customer_health_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Active
                  - At Risk
                  - Churned
  
  - name: fct_customer_revenue
      description: "Revenue and customer metrics grouped by country, industry and acquisition channel."
  
      columns:
        - name: country
          data_tests:
            - not_null
  
        - name: industry
          data_tests:
            - not_null
  
        - name: acquisition_channel
          data_tests:
            - not_null
  
        - name: total_customers
          data_tests:
            - not_null
  
        - name: total_annual_revenue
          data_tests:
            - not_null
  
        - name: churn_rate_pct
          data_tests:
            - not_null
